<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="256" cy="170" r="360">
      <stop offset="0" stop-color="#3f9a6a"/>
      <stop offset="0.55" stop-color="#2f7d55"/>
      <stop offset="1" stop-color="#235a3d"/>
    </radialGradient>
    <radialGradient id="flame" gradientUnits="userSpaceOnUse" cx="252" cy="300" r="180">
      <stop offset="0" stop-color="#ffe37a"/>
      <stop offset="0.38" stop-color="#ffc23d"/>
      <stop offset="0.68" stop-color="#f7801f"/>
      <stop offset="1" stop-color="#e23a15"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g stroke="#241206" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- Flamme : pointe principale inclinée, encoche + pointe saillante à gauche,
         pointe secondaire à droite (silhouette vivante plutôt qu'une goutte lisse) -->
    <path fill="url(#flame)" d="
      M 264 60
      C 250 120 224 146 204 168
      C 212 152 218 140 222 126
      C 192 154 166 188 156 226
      C 152 242 152 256 156 270
      C 144 260 137 246 135 230
      C 126 288 142 344 190 370
      C 210 381 233 384 256 384
      C 318 384 364 334 364 268
      C 364 234 353 202 334 176
      C 340 190 342 204 340 216
      C 322 148 290 102 264 60 Z"/>

    <!-- Yeux -->
    <ellipse cx="216" cy="268" rx="29" ry="34" fill="#fffdf5"/>
    <ellipse cx="300" cy="268" rx="29" ry="34" fill="#fffdf5"/>

    <!-- Bouche -->
    <path fill="#d1262b" d="
      M 208 318
      C 236 306 278 306 306 318
      C 302 354 282 368 257 368
      C 232 368 212 354 208 318 Z"/>

    <!-- Bûches (devant la flamme : elle repose dessus) -->
    <rect x="118" y="372" width="276" height="42" rx="21" fill="#a97244"/>
    <rect x="96" y="410" width="320" height="46" rx="23" fill="#8a5a33"/>
  </g>

  <!-- Pupilles et reflets : sans contour -->
  <circle cx="218" cy="272" r="13" fill="#1b1005"/>
  <circle cx="298" cy="272" r="13" fill="#1b1005"/>
  <circle cx="223" cy="266" r="4.5" fill="#fffdf5"/>
  <circle cx="303" cy="266" r="4.5" fill="#fffdf5"/>

  <!-- Veines du bois -->
  <g fill="none" stroke="#5e3a1e" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path d="M 150 393 a 12 9 0 1 0 0.1 0"/>
    <path d="M 130 433 a 14 10 0 1 0 0.1 0"/>
    <path d="M 300 433 h 60"/>
    <path d="M 250 393 h 46"/>
  </g>

  <!-- Étincelles : pointe recourbée pour lire « flamme » et non « goutte d'eau » -->
  <g fill="#ff9a26" stroke="#241206" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 100 206 c 14 14 20 22 20 32 a 14 14 0 0 1 -28 0 c 0 -8 6 -12 8 -20 c 1 -5 1 -8 0 -12 Z"/>
    <path d="M 412 164 c 14 14 20 22 20 32 a 14 14 0 0 1 -28 0 c 0 -8 6 -12 8 -20 c 1 -5 1 -8 0 -12 Z"/>
  </g>
</svg>
