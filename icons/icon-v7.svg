<!-- Onigiri kawaii v7 — style « sticker » : contour noir épais, aplats francs.
     Fichier SANS fond : favicon + source des PNG `any`. Les déclinaisons apple-touch
     et maskable sont composées sur une pastille crème pleine (une icône adaptative
     Android exige un calque de fond opaque, sinon le lanceur en peint un blanc) ;
     `icon-v7-mono.svg` couvre le mode « icônes thématisées ».
     viewBox resserré sur le dessin, trait de contour compris. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="90 87 332 332">
  <defs>
    <linearGradient id="o7-rice" gradientUnits="userSpaceOnUse" x1="190" y1="120" x2="340" y2="400">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efebdf"/>
    </linearGradient>
    <linearGradient id="o7-nori" gradientUnits="userSpaceOnUse" x1="256" y1="316" x2="256" y2="410">
      <stop offset="0" stop-color="#3c6b3f"/>
      <stop offset="1" stop-color="#274a2b"/>
    </linearGradient>
    <!-- La bande de nori est rognée par la boule de riz : sinon ses angles bas
         dépassent de la silhouette et la base perd sa ligne nette. -->
    <clipPath id="o7-body">
      <path d="M 228 130 C 238 104 274 104 284 130 C 306 178 372 320 400 356
               C 416 380 402 402 376 402 L 136 402 C 110 402 96 380 112 356
               C 140 320 206 178 228 130 Z"/>
    </clipPath>
  </defs>

  <!-- Boule de riz : base large et sommet mousse — une pyramide pointue ne lit pas
       comme un onigiri. -->
  <path fill="url(#o7-rice)" stroke="#1c1c1c" stroke-width="12" stroke-linejoin="round" d="
    M 228 130
    C 238 104 274 104 284 130
    C 306 178 372 320 400 356
    C 416 380 402 402 376 402
    L 136 402
    C 110 402 96 380 112 356
    C 140 320 206 178 228 130 Z"/>

  <!-- Grains suggérés, à l'écart du visage et de la bande -->
  <g fill="none" stroke="#dcd8cc" stroke-width="7" stroke-linecap="round">
    <path d="M 232 168 a 13 11 0 0 1 24 4"/>
    <path d="M 288 206 a 13 11 0 0 1 24 4"/>
    <path d="M 186 218 a 13 11 0 0 1 24 4"/>
    <path d="M 330 288 a 13 11 0 0 1 24 4"/>
    <path d="M 146 320 a 13 11 0 0 1 24 4"/>
    <path d="M 352 350 a 13 11 0 0 1 24 4"/>
    <path d="M 138 366 a 11 9 0 0 1 20 3"/>
  </g>

  <!-- Bande de nori -->
  <g clip-path="url(#o7-body)">
    <rect x="194" y="316" width="124" height="100" rx="15"
          fill="url(#o7-nori)" stroke="#1c1c1c" stroke-width="12"/>
    <g fill="#1f3d24" opacity="0.5">
      <ellipse cx="226" cy="348" rx="9" ry="7"/>
      <ellipse cx="288" cy="366" rx="7" ry="6"/>
      <ellipse cx="244" cy="390" rx="8" ry="6"/>
    </g>
  </g>

  <!-- Visage, remonté pour dégager la bande -->
  <ellipse cx="174" cy="276" rx="19" ry="10" fill="#ffadb6"/>
  <ellipse cx="338" cy="276" rx="19" ry="10" fill="#ffadb6"/>
  <g fill="#1c1c1c">
    <ellipse cx="212" cy="250" rx="14" ry="17"/>
    <ellipse cx="300" cy="250" rx="14" ry="17"/>
  </g>
  <g fill="#ffffff">
    <circle cx="217" cy="243" r="5"/>
    <circle cx="305" cy="243" r="5"/>
  </g>
  <!-- Bouche « ω », la signature du genre -->
  <path d="M 236 274 C 243 288 253 288 256 277 C 259 288 269 288 276 274"
        fill="none" stroke="#1c1c1c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
