<!-- Maki v5 — remplace la flamme (2026-07-22). Ce fichier est SANS fond : il sert de
     favicon et de source aux PNG `any`. Les déclinaisons apple-touch et maskable sont
     composées sur une pastille crème pleine, faute de quoi le lanceur Android peint
     un carré blanc derrière (une icône adaptative exige un fond opaque).
     viewBox resserré sur le dessin pour qu'il occupe tout le canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="48 48 416 416">
  <defs>
    <!-- Algue nori : vert d'encre, plus clair en haut pour le volume -->
    <linearGradient id="m5-nori" gradientUnits="userSpaceOnUse" x1="256" y1="56" x2="256" y2="456">
      <stop offset="0" stop-color="#3a4f42"/>
      <stop offset="0.55" stop-color="#27362d"/>
      <stop offset="1" stop-color="#18231d"/>
    </linearGradient>
    <!-- Riz : blanc chaud, très légèrement ombré en bas -->
    <radialGradient id="m5-rice" gradientUnits="userSpaceOnUse" cx="230" cy="205" r="215">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fdfaf1"/>
      <stop offset="1" stop-color="#ede5d4"/>
    </radialGradient>
    <!-- Saumon -->
    <radialGradient id="m5-fish" gradientUnits="userSpaceOnUse" cx="236" cy="176" r="105">
      <stop offset="0" stop-color="#ffb98c"/>
      <stop offset="0.55" stop-color="#ff9057"/>
      <stop offset="1" stop-color="#ef6b34"/>
    </radialGradient>
  </defs>

  <!-- Rondelle : nori, puis riz. Deux cercles pleins = contours nets même en 48px. -->
  <circle cx="256" cy="256" r="200" fill="url(#m5-nori)"/>
  <circle cx="256" cy="256" r="166" fill="url(#m5-rice)"/>

  <!-- Grains de riz suggérés, à l'écart du visage -->
  <g fill="#e7dfcd" opacity="0.55">
    <ellipse cx="150" cy="232" rx="15" ry="9" transform="rotate(-24 150 232)"/>
    <ellipse cx="366" cy="238" rx="15" ry="9" transform="rotate(21 366 238)"/>
    <ellipse cx="196" cy="374" rx="14" ry="8.5" transform="rotate(-12 196 374)"/>
    <ellipse cx="322" cy="378" rx="14" ry="8.5" transform="rotate(14 322 378)"/>
    <ellipse cx="256" cy="404" rx="13" ry="8" transform="rotate(-3 256 404)"/>
  </g>

  <!-- Garniture, remontée pour dégager la zone du visage sur le riz -->
  <circle cx="256" cy="200" r="72" fill="url(#m5-fish)"/>
  <!-- Gras du saumon : deux stries claires, la signature visuelle du poisson -->
  <g fill="none" stroke="#ffe3ce" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <path d="M 206 186 C 226 172 286 172 306 186"/>
    <path d="M 214 222 C 234 210 278 210 298 222"/>
  </g>

  <!-- Joues -->
  <ellipse cx="176" cy="318" rx="20" ry="12" fill="#ff8f9a" opacity="0.5"/>
  <ellipse cx="336" cy="318" rx="20" ry="12" fill="#ff8f9a" opacity="0.5"/>

  <!-- Yeux -->
  <g fill="#241b15">
    <ellipse cx="208" cy="298" rx="15" ry="19"/>
    <ellipse cx="304" cy="298" rx="15" ry="19"/>
  </g>
  <g fill="#ffffff">
    <circle cx="213" cy="291" r="5"/>
    <circle cx="309" cy="291" r="5"/>
  </g>

  <!-- Sourire -->
  <path d="M 238 338 C 246 348 266 348 274 338" fill="none" stroke="#241b15"
        stroke-width="9" stroke-linecap="round"/>
</svg>
